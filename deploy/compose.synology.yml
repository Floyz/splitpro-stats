# Complete stack for Synology Container Manager (or any docker compose host):
#   - postgres      : official SplitPro image with pg_cron
#   - splitpro      : the custom fork image (themes, banner, /stats proxy)
#   - splitpro-stats: this project, read-only on the same database, proxied under /stats
#
# 1. Copy this file and a `.env` (see SplitPro's .env.example) into the project directory.
# 2. Create the read-only role once: sql/create-readonly-role.sql (needs the stack running).
# 3. Point the DSM reverse proxy (HTTPS) at http://<nas-ip>:${PORT:-3000}.
name: splitpro

services:
  postgres:
    image: ossapps/postgres:17.7-trixie
    container_name: ${POSTGRES_CONTAINER_NAME:-splitpro-db}
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${POSTGRES_DB:-splitpro}
      -c cron.timezone=UTC
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    env_file: .env
    volumes:
      - database:/var/lib/postgresql/data

  splitpro:
    # Custom fork image built by .github/workflows/publish-custom.yml
    image: ghcr.io/${GITHUB_OWNER:?set GITHUB_OWNER in .env}/splitpro:latest
    container_name: splitpro
    restart: always
    ports:
      - ${PORT:-3000}:${PORT:-3000}
    environment:
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  splitpro-stats:
    # Service name must match STATS_INTERNAL_URL baked into the SplitPro fork image
    # (default http://splitpro-stats:3100).
    image: ghcr.io/${GITHUB_OWNER}/splitpro-stats:latest
    container_name: splitpro-stats
    restart: always
    environment:
      - DATABASE_URL=postgresql://splitpro_stats:${STATS_DB_PASSWORD:?set STATS_DB_PASSWORD in .env}@${POSTGRES_CONTAINER_NAME:-splitpro-db}:5432/${POSTGRES_DB}
      - BASE_PATH=/stats
      - PORT=3100
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  database:
  uploads:
