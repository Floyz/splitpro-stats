<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SplitPro · Statistics</title>
    <script>
      // Same origin as SplitPro: reuse its next-themes key ("theme") and the custom accent key.
      try {
        var t = localStorage.getItem('theme');
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        var a = localStorage.getItem('splitpro-accent');
        if (a) document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
